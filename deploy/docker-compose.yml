name: freshness-guard

services:
  gotest:
    image: golang:1.27.3-trixie
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    command: ["go", "test", "./..."]
    profiles: ["tools"]

  bifrost:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
      additional_contexts:
        bifrost-src: ../.cache/bifrost-src
    # Published on localhost only: the dev config.json turns off inference auth,
    # and .env holds real provider keys.
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8090:8090"]
    env_file:
      - path: .env
        required: false
    volumes:
      - bifrost-data:/app/data
      - ./config.json:/app/data/config.json:ro
    depends_on: [fakeprovider]

  fakeprovider:
    image: golang:1.27.3-trixie
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    command: ["go", "run", "./test/fakeprovider"]

  e2e:
    image: golang:1.27.3-trixie
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    environment:
      BIFROST_URL: http://bifrost:8080
      FG_URL: http://bifrost:8090
    command: ["go", "test", "-tags", "e2e", "-count=1", "-v", "./test/e2e/..."]
    depends_on: [bifrost]
    profiles: ["tools"]

volumes:
  gomodcache:
  gobuildcache:
  bifrost-data:
